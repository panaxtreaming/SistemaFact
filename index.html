<script>
    function obtenerFechaHoraActual() {
        const ahora = new Date();
        const opciones = { 
            weekday: 'short', 
            year: 'numeric', 
            month: 'short', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit', 
            hour12: true 
        };
        let fechaActual = ahora.toLocaleString('es-ES', opciones);
        fechaActual = fechaActual.replace(/\./g, '').replace(/a\.\s*m\./g, 'a. m.').replace(/p\.\s*m\./g, 'p. m.');
        fechaActual = fechaActual.charAt(0).toUpperCase() + fechaActual.slice(1);
        return fechaActual;
    }

    function actualizarFechaHora() {
        document.getElementById('fecha').value = obtenerFechaHoraActual();

    function formatNumberVES(numero) {
        let partes = numero.toFixed(2).split('.');
        let entero = partes[0];
        let decimal = partes[1];
        entero = entero.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return entero + "," + decimal;

        const selector = document.getElementById('planSelector');
        selector.innerHTML = '';
        let categorias = [
            { nombre: "📺 PANAXTREAMING", planes: planes.filter(p => p.categoria === "pana") },
            { nombre: "⭐ STELLA TV", planes: planes.filter(p => p.categoria === "stella") },
            { nombre: "🎬 FLUJO TV", planes: planes.filter(p => p.categoria === "flujo") }
        ];
        categorias.forEach(cat => {
            if (cat.planes.length > 0) {
                let separator = document.createElement('option');
                separator.disabled = true;
                separator.textContent = `─── ${cat.nombre} ───`;
                separator.style.fontWeight = 'bold';
                separator.style.backgroundColor = '#f0f0f0';
                selector.appendChild(separator);
                cat.planes.forEach((plan, idx) => {
                    const option = document.createElement('option');
                    option.value = planes.indexOf(plan);
                    option.textContent = `   ${plan.nombre} - ${plan.duracion} - ${plan.tipoServicio} (${plan.dispositivos}) - $ ${formatNumberVES(plan.precio)} USD`;
                    selector.appendChild(option);
                });
            }
        });
        selector.addEventListener('change', (e) => {
            const idx = parseInt(e.target.value);
            if (!isNaN(idx)) {
                planSeleccionado = planes[idx];
                actualizarPreview();
                actualizarResumenPrecios();
                generarFactura();
            }
        });
        if (planes.length > 0) {
            selector.value = "0";
            planSeleccionado = planes[0];
            actualizarPreview();
        }
    }
    
    function actualizarPreview() {
        document.getElementById('previewNombre').textContent = planSeleccionado.nombre;
        document.getElementById('previewDuracion').textContent = `${planSeleccionado.duracion} | ${planSeleccionado.tipoServicio} | ${planSeleccionado.dispositivos}`;
        document.getElementById('previewPrecio').textContent = `$ ${formatNumberVES(planSeleccionado.precio)} USD`;
        const tipoTexto = getTipoOperacionTexto();
        document.getElementById('planSeleccionadoTexto').innerHTML = `${getTipoOperacionIcono()} ${tipoTexto} - ${planSeleccionado.nombre} - ${planSeleccionado.duracion} (${planSeleccionado.tipoServicio} - ${planSeleccionado.dispositivos}) - $ ${formatNumberVES(planSeleccionado.precio)}`;
        document.getElementById('tipoBadge').innerHTML = `${getTipoOperacionIcono()} ${tipoTexto}`;
        const previewImg = document.getElementById('previewImg');
        if (planSeleccionado.esCombo && planSeleccionado.imagenCombo) {
            previewImg.src = planSeleccionado.imagenCombo[0];
            previewImg.style.border = "2px solid #dc2626";
        } else {
            previewImg.src = planSeleccionado.imagen || imgStella;
            previewImg.style.border = "none";
        }
    }

    function actualizarResumenPrecios() {
        let tasa = parseFloat(document.getElementById('tasaBcv').value) || 0;
        let extraUSD = parseFloat(document.getElementById('montoExtraUSD').value) || 0;
        let totalUSD = planSeleccionado.precio + extraUSD;
        let totalBs = totalUSD * tasa;
        document.getElementById('precioUSDResumen').innerText = formatNumberVES(totalUSD);
        document.getElementById('precioBSResumen').innerText = formatNumberVES(totalBs);
        document.getElementById('tasaMostrada').innerHTML = formatNumberVES(tasa);
    }

    function nuevaFactura() {
        incrementarContador();
        actualizarFechaHora();
        document.getElementById('cliente_nombre').value = '';
        document.getElementById('cliente_cedula').value = '';
        document.getElementById('cliente_tel').value = '';
        document.getElementById('cliente_email').value = '';
        document.getElementById('detalleSuscripcion').value = '';
        document.getElementById('montoExtraUSD').value = '0';
        actualizarCampoPedido();
        actualizarResumenPrecios();
        generarFactura();
        alert(`✅ Nueva factura creada con número: ${document.getElementById('pedido').value}`);
    }

    function getLogosHtml() {
        const service = planSeleccionado.logoService;
        if (service === 'pana') {
            return `<div class="servicio-logos"><img src="${imgPana}" alt="PANAXTREAMING"><span>🎬 SERVICIO CONTRATADO: PANAXTREAMING 🎬</span></div>`;
        } else if (service === 'stella') {
            return `<div class="servicio-logos"><img src="${imgStella}" alt="STELLA TV"><span>⭐ SERVICIO CONTRATADO: STELLA TV ⭐</span></div>`;
        } else if (service === 'combo') {
            return `<div class="servicio-logos"><img src="${imgPana}" alt="PANAXTREAMING"><span>+</span><img src="${imgStella}" alt="STELLA TV"><br><span>🎯 COMBO: PANAXTREAMING + STELLA TV 🎯</span></div>`;
        }
        return '';
    }

    function generarFactura() {
        let tasa = parseFloat(document.getElementById('tasaBcv').value) || 0;
        let fechaBcv = document.getElementById('fechaBcv').value;
        let extraUSD = parseFloat(document.getElementById('montoExtraUSD').value) || 0;
        let detalleSuscripcion = document.getElementById('detalleSuscripcion').value;
        let totalUSD = planSeleccionado.precio + extraUSD;
        let totalBs = totalUSD * tasa;
        let pedido = document.getElementById('pedido').value;
        let fecha = document.getElementById('fecha').value;
        let clienteNombre = document.getElementById('cliente_nombre').value || 'CLIENTE NO ESPECIFICADO';
        let cedula = document.getElementById('cliente_cedula').value || 'NO REGISTRA';
        let clienteTel = document.getElementById('cliente_tel').value || 'NO REGISTRA';
        let clienteEmail = document.getElementById('cliente_email').value || 'NO REGISTRA';
        let metodoPago = document.getElementById('pago_metodo').value;
        let tipoOperacion = getTipoOperacionTexto();
        let tipoIcono = getTipoOperacionIcono();
        let logosHtml = getLogosHtml();

        let detalleHtml = '';
        if (detalleSuscripcion.trim() !== "") {
            detalleHtml = `
                <div class="detalle-suscripcion-box">
                    <strong>📋 DATOS DE LA SUSCRIPCIÓN:</strong><br>
                    ${detalleSuscripcion.replace(/\n/g, '<br>')}
                </div>
            `;
        }

        let itemsHtml = `<tr>
            <td><strong>${tipoIcono} ${tipoOperacion}</strong><br>
                <strong>📺 ${planSeleccionado.nombre}</strong><br>
                📅 ${planSeleccionado.duracion}<br>
                🎯 Tipo: ${planSeleccionado.tipoServicio}<br>
                📱 Dispositivos: ${planSeleccionado.dispositivos}<br>
                <span style="font-size: 10px; color: #555;">📌 BCV ${fechaBcv}: 1 USD = ${formatNumberVES(tasa)} Bs</span></td>
            <td style="text-align:center">1</td>
            <td style="text-align:right">$ ${formatNumberVES(planSeleccionado.precio)}</td>
        </tr>`;
        
        if (extraUSD > 0) {
            itemsHtml += `<tr>
                <td>💰 Servicio adicional / Extra</td>
                <td style="text-align:center">1</td>
                <td style="text-align:right">$ ${formatNumberVES(extraUSD)}</td>
            </tr>`;
        }

        // Mensaje de éxito con los datos de la operación
        let mensajeExitoHtml = `
            <div class="mensaje-exito">
                <strong>${tipoIcono} ${tipoOperacion} CON ÉXITO ${tipoIcono}</strong><br>
                👤 Usuario: panastella103<br>
                🔑 Nueva clave: 252525<br>
                📅 Fecha de ${tipoOperacion.toLowerCase()}: ${fecha}<br>
                💲 Pagado: $ ${formatNumberVES(totalUSD)} / ${formatNumberVES(totalBs)} Bs
            </div>
        `;

        document.getElementById('factura-aqui').innerHTML = `
            <div class="invoice" id="facturaParaImprimir">
                <div class="invoice-header-superior">
                    <img src="https://i.pinimg.com/736x/c0/3e/ed/c03eeddad09b91f76dd63ae373d0d27e.jpg" alt="PanaXtreaming Logo">
                </div>
                <div class="invoice-contenido">
                    <div class="servicios-titulo">SERVICIOS PANAXTREAMING</div>
                    ${logosHtml}
                    <div class="company-info"><strong>PANAXTREAMING</strong><br>Caracas - Venezuela<br>Dtto. Capital, Distrito Federal 1014<br>Atención al cliente: +58 416-1379797 / panaxtreaming@gmail.com</div>
                    
                    <div class="row-2col">
                        <div class="customer-info">
                            <strong>📋 DATOS DEL CLIENTE</strong><br>
                            Nombre: ${clienteNombre}<br>
                            CÉDULA: ${cedula}<br>
                            CARACAS, 1014 - Venezuela<br>
                            Tel: ${clienteTel}<br>
                            Email: ${clienteEmail}
                        </div>
                        <div class="customer-info">
                            <strong>📄 PEDIDO</strong><br>
                            Pedido ${pedido}<br>
                            Fecha: ${fecha}<br>
                            <strong>TIPO: ${tipoIcono} ${tipoOperacion}</strong>
                        </div>
                    </div>
                    
                    ${detalleHtml}
                    
                    <div class="payment-method">
                        💰 MÉTODO DE PAGO:<br>
                        ${metodoPago}<br><br>
                        🇻🇪 TASA BCV (${fechaBcv}): 1 USD = ${formatNumberVES(tasa)} Bs
                    </div>
                    
                    <table class="invoice-items">
                        <thead>
                            <tr><th>DETALLE DEL SERVICIO CONTRATADO</th><th>CANT.</th><th>PRECIO USD</th>
                        </thead>
                        <tbody>${itemsHtml}</tbody>
                    </table>
                    
                    <!-- MENSAJE DE ÉXITO - AHORA ANTES DEL TOTAL -->
                    ${mensajeExitoHtml}
                    
                    <!-- TOTAL - AHORA DESPUÉS DEL MENSAJE DE ÉXITO -->
                    <div class="total-row">
                        TOTAL EN USD: $ ${formatNumberVES(totalUSD)}<br>
                        <span class="total-bs">🇻🇪 TOTAL EN BOLÍVARES (BCV ${fechaBcv}): ${formatNumberVES(totalBs)} Bs</span>
                    </div>
                    
                    <div class="footer-thanks">✨ ¡Gracias por su pedido! ✨<br>${fecha} - Pedido ${pedido}</div>
                </div>
            </div>`;
        actualizarResumenPrecios();
    }

    function guardarPDF() {
        const numeroPedido = document.getElementById('pedido').value;
        const nombreArchivo = `COMPROBANTE DE PAGO Y DATOS DE SUSCRIPCION - ${numeroPedido}.pdf`;
        const facturaHTML = document.getElementById('facturaParaImprimir').outerHTML;
        
        const iframe = document.createElement('iframe');
        iframe.style.position = 'absolute';
        iframe.style.width = '0px';
        iframe.style.height = '0px';
        iframe.style.border = '0';
        document.body.appendChild(iframe);
        
        const iframeDoc = iframe.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>${nombreArchivo}</title>
                <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: 'Roboto Mono', 'Courier New', monospace; padding: 20px; background: white; }
                    .invoice { background: white; max-width: 900px; margin: 0 auto; font-family: 'Roboto Mono', 'Courier New', monospace; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; }
                    .invoice-header-superior { background: #000000; padding: 25px 20px; text-align: center; }
                    .invoice-header-superior img { max-width: 200px; height: auto; margin: 0 auto; display: block; }
                    .invoice-contenido { padding: 30px; }
                    .servicios-titulo { text-align: center; font-size: 18px; font-weight: 800; color: #b91c1c; margin-top: 5px; margin-bottom: 10px; letter-spacing: 2px; font-family: 'Poppins', sans-serif; }
                    .servicio-logos { text-align: center; margin: 15px 0; padding: 10px; background: #fef2f2; border-radius: 16px; border: 1px solid #fecaca; }
                    .servicio-logos img { max-width: 80px; height: auto; margin: 0 10px; border-radius: 12px; }
                    .servicio-logos span { font-size: 20px; font-weight: bold; color: #b91c1c; margin: 0 10px; }
                    .company-info, .customer-info { font-size: 11px; line-height: 1.5; margin-bottom: 15px; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; background: #fafafa; }
                    .row-2col { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
                    .row-2col > div { flex: 1; }
                    .detalle-suscripcion-box { background: #f0f9ff; border: 1px solid #bae6fd; border-left: 5px solid #0284c7; padding: 12px; margin-bottom: 15px; border-radius: 12px; font-size: 11px; line-height: 1.5; }
                    .detalle-suscripcion-box strong { color: #0369a1; }
                    .payment-method { background: #fef9c3; padding: 12px; font-size: 11px; border-left: 5px solid #eab308; margin-bottom: 15px; white-space: pre-line; border-radius: 12px; font-weight: 500; }
                    table.invoice-items { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 12px; font-family: 'Roboto Mono', monospace; }
                    table.invoice-items th, table.invoice-items td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; vertical-align: top; }
                    table.invoice-items th { background: #f1f5f9; font-weight: 700; font-family: 'Poppins', sans-serif; }
                    .mensaje-exito { background: #d9f0e6; padding: 15px; margin: 20px 0; border-radius: 16px; font-size: 11px; font-family: 'Roboto Mono', monospace; border-left: 5px solid #15803d; line-height: 1.8; }
                    .mensaje-exito strong { color: #166534; }
                    .total-row { text-align: right; font-weight: 800; font-size: 16px; border-top: 2px solid #cbd5e1; padding-top: 12px; margin-top: 12px; font-family: 'Poppins', sans-serif; }
                    .total-bs { color: #15803d; font-size: 14px; font-weight: 700; }
                    .footer-thanks { text-align: center; margin-top: 20px; font-size: 11px; font-weight: 500; font-family: 'Poppins', sans-serif; color: #475569; }
                </style>
            </head>
            <body>
                ${facturaHTML}
            </body>
            </html>
        `);
        iframeDoc.close();
        
        iframe.contentWindow.onload = function() {
            iframe.contentWindow.print();
            setTimeout(() => { document.body.removeChild(iframe); }, 1000);
        };
    }

    document.getElementById('tasaBcv').addEventListener('input', () => { actualizarResumenPrecios(); generarFactura(); });
    document.getElementById('montoExtraUSD').addEventListener('input', () => { actualizarResumenPrecios(); generarFactura(); });
    document.getElementById('detalleSuscripcion').addEventListener('input', generarFactura);
    document.getElementById('pago_metodo').addEventListener('change', generarFactura);
    document.getElementById('tipoOperacion').addEventListener('change', () => { actualizarPreview(); actualizarResumenPrecios(); generarFactura(); });
    ['cliente_nombre', 'cliente_cedula', 'cliente_tel', 'cliente_email'].forEach(id => document.getElementById(id).addEventListener('input', generarFactura));
    document.getElementById('fechaBcv').addEventListener('input', generarFactura);
    
    llenarSelectorPlanes();
    actualizarCampoPedido();
    actualizarFechaHora();
    generarFactura();
</script>
</body>
</html>
